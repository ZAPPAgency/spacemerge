# .github/workflows/preview.yml
name: Deploy PR previews

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One group per PR: a new push replaces the running preview of the same PR only.
# Never share it with other workflows: a group keeps only one pending run.
concurrency:
  group: pr-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Needed by wait-for-pages-deployment (reads the Pages builds API). A `permissions`
  # block sets unlisted scopes to none: without it the action times out.
  pages: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: www
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: true
          wait-for-pages-deployment: true
